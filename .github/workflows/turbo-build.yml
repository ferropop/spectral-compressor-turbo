name: Turbo Mac and Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-universal
            os: macos-15
          - platform: Windows-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: turbo-${{ matrix.platform }}
      - name: Rust regression tests
        shell: bash
        run: |
          mkdir -p validation
          set -o pipefail
          cargo test -p spectral_compressor --lib --locked 2>&1 | tee validation/rust-tests.txt
          cargo test -p nih_plug_vizia --lib --locked 2>&1 | tee validation/resize-tests.txt
      - name: Build universal Mac
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo xtask bundle-universal spectral_compressor --release --locked
          python3 scripts/sign_macos.py
          lipo -info 'target/bundled/Spectral Compressor Turbo.vst3/Contents/MacOS/Spectral Compressor Turbo' | tee validation/architectures.txt
      - name: Build Windows x64
        if: runner.os == 'Windows'
        shell: bash
        run: cargo xtask bundle spectral_compressor --release --locked
      - name: Validate native Mac VST3
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fL https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip -d validator
          validator/pluginval.app/Contents/MacOS/pluginval --validate 'target/bundled/Spectral Compressor Turbo.vst3' --strictness-level 5 --random-seed 42 --skip-gui-tests > validation/pluginval.txt 2>&1
          cat validation/pluginval.txt
          grep -q 'SUCCESS' validation/pluginval.txt
      - name: Validate native Windows VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip validator
          $validator = (Get-ChildItem validator -Recurse -Filter pluginval.exe | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $validator -ArgumentList '--validate "target/bundled/Spectral Compressor Turbo.vst3" --strictness-level 5 --random-seed 42 --skip-gui-tests' -Wait -PassThru -RedirectStandardOutput validation/pluginval.txt -RedirectStandardError validation/pluginval-stderr.txt
          Get-Content validation/pluginval.txt
          if ($process.ExitCode -ne 0) { throw "pluginval failed ($($process.ExitCode))" }
          if (-not (Select-String -Path validation/pluginval.txt -Pattern 'SUCCESS' -Quiet)) { throw 'Missing pluginval success result' }
      - name: Package binaries
        shell: bash
        run: python3 scripts/package_release.py '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Spectral-Compressor-Turbo-${{ matrix.platform }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.platform }}
          path: validation/
